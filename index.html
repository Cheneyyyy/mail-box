<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src blob:; form-action 'none'; base-uri 'none'">
<title>收件箱</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{color-scheme:light;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#392f28;background:#f5f0e7}
body{margin:0}
main{width:min(100%,510px);margin:auto;padding:clamp(26px,7vh,68px) clamp(17px,5vw,30px) max(28px,env(safe-area-inset-bottom))}
h1,h2,p{margin:0}
h1{font-size:clamp(30px,5vw,40px);letter-spacing:-.045em;line-height:1.15}
header p{margin:9px 0 20px;color:#6c6055}
section{padding:18px;margin-top:14px;background:#fffcf7;border:1px solid #e3d8ca;border-radius:20px}
h2{font-size:19px;line-height:1.35}
small,.hint{display:block;color:#75695e;font-size:.855rem}
.hint{margin:5px 0 12px}
a,button{font:inherit;font-weight:650;text-decoration:none;cursor:pointer;color:#704e39}
.button{display:inline-flex;align-items:center;justify-content:center;border:1px solid #d5c6b6;border-radius:12px;background:#fbf6ee;min-height:44px;padding:9px 14px;text-align:center}
.primary{width:100%;color:white;background:#855a40;border-color:#855a40}
.phone-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#remembered{display:flex;margin:14px 0 6px}
.secondary{padding:8px 0;background:none;border:none;font:inherit;font-size:.875rem;color:#78583f;text-decoration:underline;text-underline-offset:3px}
#knownAddress{overflow-wrap:anywhere}
#launchHelp{color:#75695e;font-size:.855rem;margin-top:12px}
#launchHelp summary{cursor:pointer;color:#704e39}
#launchHelp p{margin:7px 0}
#launchFeedback{margin:12px 0 8px;color:#513d2d}
#localOpen{width:100%;margin-top:8px}
button:disabled{opacity:.58;cursor:default}
input,button,a{touch-action:manipulation}
:focus-visible{outline:3px solid #895330;outline-offset:3px}
form{margin-top:14px}
label{display:block;font-weight:600;margin:0 0 6px}
.code-row{display:flex;align-items:center;gap:8px}
input{min-width:0;flex:1;padding:10px 12px;font:16px/1.45 ui-monospace,Consolas,monospace;color:inherit;background:#fcf8f0;border:1px solid #d7c9b8;border-radius:11px}
#camera{margin-top:12px}
video{display:block;background:#322d28;object-fit:cover;width:100%;aspect-ratio:4/3;border-radius:12px;margin-bottom:8px}
#notice{font-size:.875rem;color:#804626;margin:10px 0 0}
@media(min-width:720px){main{padding-top:min(15vh,150px)}}
</style>
<script src="./scan.js?v=desktop-launch-2" defer></script>
</head>
<body>
<main>
<header>
  <h1>收件箱</h1>
  <p>手机和电脑连上同一 Wi-Fi 或热点。</p>
</header>
<section id="returning" hidden>
  <h2 id="knownName">已记住的电脑</h2>
  <small id="knownAddress"></small>
  <a id="remembered" class="button primary">打开已记住的收件箱</a>
  <p class="hint" id="networkHint">在家连同一 Wi-Fi；在学校打不开时，先开手机热点并让电脑连上。</p>
  <button id="changeComputer" class="secondary" type="button">换一台电脑或重新配对</button>
  <a id="pairAgain" class="secondary" href="cheney-inbox://pair" hidden>配对新手机</a>
</section>
<div id="setup">
<section id="desktopCard">
  <h2>电脑端</h2>
  <div class="phone-actions">
    <a class="button primary" id="desktop" href="cheney-inbox://open">打开电脑收件箱</a>
    <a class="button" id="desktopPair" href="cheney-inbox://pair">配对新手机</a>
  </div>
  <div id="launchPanel">
    <p id="launchFeedback" role="status" hidden></p>
    <a id="localOpen" class="button" href="http://127.0.0.1:8765/" hidden>在当前标签打开收件箱</a>
    <details id="launchHelp"><summary>没有打开？</summary>
      <p>请用 Windows 的系统浏览器打开此页。如果取消了启动提示，可重新点一次。</p>
      <p>程序未启动时，在电脑的收件箱文件夹双击 <code>start.bat</code>，再点「在当前标签打开」。如果浏览器提示找不到应用，可双击「注册网页启动.cmd」恢复网页启动。</p>
    </details>
  </div>
</section>
<section aria-labelledby="phone">
  <h2 id="phone">手机端</h2>
  <p class="hint">用手机扫电脑上的二维码，也可以输入连接码。</p>
  <div class="phone-actions">
    <button type="button" class="button primary" id="scan">扫码配对</button>
    <button type="button" class="button" id="enterCode" aria-controls="codeForm" aria-expanded="false">输入连接码</button>
  </div>
  <div id="camera" hidden>
    <video id="video" muted playsinline autoplay aria-label="扫码取景框"></video>
    <button type="button" class="button" id="cancelScan">关闭相机</button>
  </div>
  <form id="codeForm" hidden>
    <label for="code">电脑上显示的连接码</label>
    <div class="code-row">
      <input id="code" type="text" maxlength="48" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX">
      <button class="button" type="submit">配对</button>
    </div>
  </form>
  <p id="notice" role="status" hidden></p>
</section>
</div>
</main>
</body>
</html>
